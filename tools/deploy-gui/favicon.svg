<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 -330 440 430" role="img" aria-label="linvlib">
  <!-- Landing CSS geometry mirrored: 220×299.2 (yellow 170×231.2),
       transform-origin center bottom, same translate/rotate. No volume numbers. -->
  <defs>
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8e06a"/><stop offset="100%" stop-color="#8fc93a"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2a0b8"/><stop offset="100%" stop-color="#e07898"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ec8f0"/><stop offset="100%" stop-color="#4aa3dc"/>
    </linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d56a"/><stop offset="100%" stop-color="#e0b830"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity=".28"/>
      <stop offset="75%" stop-color="#000" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2=".25" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="o1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8eb84"/><stop offset="100%" stop-color="#9fd44a"/>
    </linearGradient>
    <linearGradient id="o2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5b4c6"/><stop offset="100%" stop-color="#e88aa6"/>
    </linearGradient>
    <linearGradient id="o3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ad6f5"/><stop offset="100%" stop-color="#62b4e6"/>
    </linearGradient>
    <linearGradient id="o4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/><stop offset="100%" stop-color="#ebc44a"/>
    </linearGradient>
    <linearGradient id="ol" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity=".14"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="or" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity=".1"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-35%" y="-25%" width="170%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#152238" flood-opacity=".12"/>
    </filter>
    <clipPath id="cBig"><rect x="-110" y="-299.2" width="220" height="299.2" rx="6" ry="12"/></clipPath>
    <clipPath id="cSm"><rect x="-85" y="-231.2" width="170" height="231.2" rx="6" ry="12"/></clipPath>
  </defs>

  <g filter="url(#sh)">
    <!-- 1 lime: translate(-70,20) rotate(-14) -->
    <g transform="translate(-70 20) rotate(-14)" clip-path="url(#cBig)">
      <rect x="-110" y="-299.2" width="220" height="299.2" rx="6" ry="12" fill="url(#s1)"/>
      <rect x="-110" y="-299.2" width="22" height="299.2" fill="url(#edge)"/>
      <rect x="-74.8" y="-278.256" width="158.4" height="222.256" rx="3" fill="url(#face)" stroke="#fff" stroke-opacity=".4" stroke-width="1.5"/>
      <rect x="-50.96" y="-250" width="95.04" height="5" rx="2.5" fill="#fff" fill-opacity=".5"/>
      <rect x="-50.96" y="-239" width="119.6" height="5" rx="2.5" fill="#fff" fill-opacity=".5"/>
      <rect x="-50.96" y="-228" width="70.56" height="5" rx="2.5" fill="#fff" fill-opacity=".5"/>
      <rect x="-110" y="-64" width="220" height="64" rx="0" fill="url(#o1)"/>
      <rect x="-110" y="-64" width="4" height="64" fill="url(#ol)"/>
      <rect x="106" y="-64" width="4" height="64" fill="url(#or)"/>
    </g>

    <!-- 3 pink: translate(10,-10) rotate(4) -->
    <g transform="translate(10 -10) rotate(4)" clip-path="url(#cBig)">
      <rect x="-110" y="-299.2" width="220" height="299.2" rx="6" ry="12" fill="url(#s2)"/>
      <rect x="-110" y="-299.2" width="22" height="299.2" fill="url(#edge)"/>
      <rect x="-74.8" y="-278.256" width="158.4" height="222.256" rx="3" fill="url(#face)" stroke="#fff" stroke-opacity=".4" stroke-width="1.5"/>
      <rect x="-50.96" y="-250" width="95.04" height="5" rx="2.5" fill="#fff" fill-opacity=".5"/>
      <rect x="-50.96" y="-239" width="119.6" height="5" rx="2.5" fill="#fff" fill-opacity=".5"/>
      <rect x="-50.96" y="-228" width="70.56" height="5" rx="2.5" fill="#fff" fill-opacity=".5"/>
      <rect x="-110" y="-64" width="220" height="64" fill="url(#o2)"/>
      <rect x="-110" y="-64" width="4" height="64" fill="url(#ol)"/>
      <rect x="106" y="-64" width="4" height="64" fill="url(#or)"/>
    </g>

    <!-- 2 sky: translate(90,40) rotate(16) -->
    <g transform="translate(90 40) rotate(16)" clip-path="url(#cBig)">
      <rect x="-110" y="-299.2" width="220" height="299.2" rx="6" ry="12" fill="url(#s3)"/>
      <rect x="-110" y="-299.2" width="22" height="299.2" fill="url(#edge)"/>
      <rect x="-74.8" y="-278.256" width="158.4" height="222.256" rx="3" fill="url(#face)" stroke="#fff" stroke-opacity=".4" stroke-width="1.5"/>
      <rect x="-50.96" y="-250" width="95.04" height="5" rx="2.5" fill="#fff" fill-opacity=".5"/>
      <rect x="-50.96" y="-239" width="119.6" height="5" rx="2.5" fill="#fff" fill-opacity=".5"/>
      <rect x="-50.96" y="-228" width="70.56" height="5" rx="2.5" fill="#fff" fill-opacity=".5"/>
      <rect x="-110" y="-64" width="220" height="64" fill="url(#o3)"/>
      <rect x="-110" y="-64" width="4" height="64" fill="url(#ol)"/>
      <rect x="106" y="-64" width="4" height="64" fill="url(#or)"/>
    </g>

    <!-- 4 yellow: translate(-20,90) rotate(-3), width 170 -->
    <g transform="translate(-20 90) rotate(-3)" clip-path="url(#cSm)">
      <rect x="-85" y="-231.2" width="170" height="231.2" rx="6" ry="12" fill="url(#s4)"/>
      <rect x="-85" y="-231.2" width="17" height="231.2" fill="url(#edge)"/>
      <rect x="-57.8" y="-215.016" width="122.4" height="159.016" rx="3" fill="url(#face)" stroke="#fff" stroke-opacity=".4" stroke-width="1.5"/>
      <rect x="-38.24" y="-193" width="73.44" height="5" rx="2.5" fill="#fff" fill-opacity=".5"/>
      <rect x="-38.24" y="-182" width="92.4" height="5" rx="2.5" fill="#fff" fill-opacity=".5"/>
      <rect x="-38.24" y="-171" width="54.5" height="5" rx="2.5" fill="#fff" fill-opacity=".5"/>
      <rect x="-85" y="-64" width="170" height="64" fill="url(#o4)"/>
      <rect x="-85" y="-64" width="4" height="64" fill="url(#ol)"/>
      <rect x="81" y="-64" width="4" height="64" fill="url(#or)"/>
    </g>
  </g>
</svg>
